<svg viewBox="0 0 820 470" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Women, cycles and iron: more iron leaves than arrives</title>
  <desc>A bucket of iron stores at a low level. Dietary iron flows in but is partly blocked by phytate, which phytase helps open. Iron flows out through monthly menstrual loss, sweat and foot-strike, leaving ferritin low.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;}
    .title{font-size:23px;font-weight:700;fill:#22565c;}
    .sub{font-size:13px;fill:#6f6a62;}
    .cap{font-size:12px;fill:#6f6a62;}
    .lab{font-size:12px;font-weight:700;fill:#22565c;}
    .out{font-size:12px;fill:#6e807d;}
    .foot{font-size:12px;font-weight:600;fill:#22565c;}
  </style>
  <text class="title" x="410" y="34" text-anchor="middle">The iron you can&#8217;t see</text>
  <text class="sub" x="410" y="56" text-anchor="middle">For female runners, more iron leaves than arrives</text>

  <defs>
    <marker id="at" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22565c"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6e807d"/></marker>
  </defs>

  <!-- inflow -->
  <text class="lab" x="70" y="150">iron in (diet)</text>
  <line x1="70" y1="168" x2="338" y2="210" stroke="#22565c" stroke-width="8" marker-end="url(#at)" opacity="0.85"/>
  <!-- phytate gate on the inflow -->
  <rect x="196" y="170" width="20" height="40" rx="3" fill="#a5b4b1"/>
  <text class="cap" x="206" y="232" text-anchor="middle" style="fill:#6e807d;font-weight:700">phytate</text>
  <text class="cap" x="206" y="150" text-anchor="middle" style="fill:#c4571a;font-weight:700">phytase opens this</text>

  <!-- bucket -->
  <polygon points="350,196 470,196 456,330 364,330" fill="#f7f5f3" stroke="#22565c" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- low fill -->
  <polygon points="368,286 452,286 456,326 366,326" fill="#f36f21" opacity="0.85"/>
  <line x1="360" y1="286" x2="460" y2="286" stroke="#22565c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="cap" x="410" y="356" text-anchor="middle" style="font-weight:700">ferritin: low</text>

  <!-- outflows -->
  <line x1="470" y1="226" x2="560" y2="210" stroke="#6e807d" stroke-width="5" marker-end="url(#ao)"/>
  <text class="out" x="566" y="214">monthly blood loss</text>
  <line x1="470" y1="258" x2="560" y2="258" stroke="#6e807d" stroke-width="4" marker-end="url(#ao)"/>
  <text class="out" x="566" y="262">sweat</text>
  <line x1="466" y1="296" x2="560" y2="306" stroke="#6e807d" stroke-width="4" marker-end="url(#ao)"/>
  <text class="out" x="566" y="310">foot-strike</text>

  <line x1="24" y1="414" x2="796" y2="414" stroke="#dadfd0" stroke-width="1"/>
  <text class="foot" x="24" y="440">Pair high-phytate meals with phytase to absorb more of what you eat.</text>
  <text class="cap" x="796" y="440" text-anchor="end" style="font-weight:600;fill:#22565c">Sponsored by Goodphyte &#183; goodphyte.com</text>
</svg>
