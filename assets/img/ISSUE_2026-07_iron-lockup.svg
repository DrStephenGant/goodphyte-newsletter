<svg viewBox="0 0 820 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>The phytate lockup: phytase frees five bound minerals</title>
  <desc>Three stages. One: phytate in food binds five minerals - iron, magnesium, copper, zinc and calcium - so they are not absorbed. Two: the enzyme phytase cleaves phytate. Three: all five freed minerals are absorbed across the gut lining.</desc>
  <style>
    svg{ --t:var(--color-text-primary,#1b1b1a); --s:var(--color-text-secondary,#6b6b6b);
         --b:var(--color-border-primary,#dcdcd6); --card:var(--color-bg-secondary,#f7f7f4);
         --amber:#9a6b00; --green:#1f7a1f; }
    .title{font:700 23px ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;fill:var(--t);}
    .sub{font:400 13px ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;fill:var(--s);}
    .stage{font:700 13px ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;letter-spacing:.5px;}
    .cap{font:400 12px ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;fill:var(--s);}
    .ionlab{font:700 9px ui-sans-serif;fill:#fff;}
    .pill{font:700 12px ui-sans-serif;fill:#fff;}
    .leg{font:400 12px ui-sans-serif;fill:var(--s);}
    .foot{font:600 12px ui-sans-serif;fill:var(--t);}
    .amber{fill:var(--amber);} .green{fill:var(--green);}
  </style>

  <text class="title" x="410" y="34" text-anchor="middle">The phytate&#8211;iron lockup</text>
  <text class="sub" x="410" y="56" text-anchor="middle">Phytase frees five bound minerals: iron, magnesium, copper, zinc &amp; calcium</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="var(--s)"/>
    </marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="var(--green)"/>
    </marker>
  </defs>

  <rect x="24" y="78" width="220" height="266" rx="12" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="stage amber" x="134" y="104" text-anchor="middle">LOCKED IN FOOD</text>
  <text class="cap amber" x="134" y="150" text-anchor="middle" style="font-weight:700">phytate</text>
  <rect x="54" y="168" width="160" height="50" rx="9" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-dasharray="3 5"/>
  <path d="M89,168 V218 M119,168 V218 M149,168 V218 M179,168 V218" stroke="var(--amber)" stroke-width="2" opacity="0.7"/>
  <g>
    <circle cx="74" cy="193" r="12" class="amber"/><text class="ionlab" x="74" y="196" text-anchor="middle">Fe</text>
    <circle cx="104" cy="193" r="12" class="amber"/><text class="ionlab" x="104" y="196" text-anchor="middle">Mg</text>
    <circle cx="134" cy="193" r="12" class="amber"/><text class="ionlab" x="134" y="196" text-anchor="middle">Cu</text>
    <circle cx="164" cy="193" r="12" class="amber"/><text class="ionlab" x="164" y="196" text-anchor="middle">Zn</text>
    <circle cx="194" cy="193" r="12" class="amber"/><text class="ionlab" x="194" y="196" text-anchor="middle">Ca</text>
  </g>
  <text class="cap" x="134" y="300" text-anchor="middle">Phytate binds five minerals</text>
  <text class="cap" x="134" y="316" text-anchor="middle" style="font-weight:700">Fe &#183; Mg &#183; Cu &#183; Zn &#183; Ca</text>

  <line x1="250" y1="205" x2="292" y2="205" stroke="var(--s)" stroke-width="2" marker-end="url(#ah)"/>
  <text class="cap" x="271" y="196" text-anchor="middle" style="font-weight:700">phytase</text>

  <rect x="300" y="78" width="220" height="266" rx="12" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="stage green" x="410" y="104" text-anchor="middle">PHYTASE ACTS</text>
  <path d="M388,150 H338 a6,6 0 0 0 -6,6 V214 a6,6 0 0 0 6,6 H388" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-dasharray="3 5"/>
  <path d="M432,150 H482 a6,6 0 0 1 6,6 V214 a6,6 0 0 1 -6,6 H432" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-dasharray="3 5"/>
  <rect x="372" y="168" width="76" height="34" rx="17" class="green"/>
  <text class="pill" x="410" y="190" text-anchor="middle">phytase</text>
  <path d="M410,142 l-6,-9 M410,142 l6,-9 M410,214 l-6,9 M410,214 l6,9" stroke="var(--green)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text class="cap" x="410" y="300" text-anchor="middle">The enzyme cleaves</text>
  <text class="cap" x="410" y="316" text-anchor="middle">phytate, releasing all five</text>

  <line x1="526" y1="205" x2="568" y2="205" stroke="var(--s)" stroke-width="2" marker-end="url(#ah)"/>
  <text class="cap" x="547" y="196" text-anchor="middle" style="font-weight:700">absorb</text>

  <rect x="576" y="78" width="220" height="266" rx="12" fill="var(--card)" stroke="var(--b)" stroke-width="1.5"/>
  <text class="stage green" x="686" y="104" text-anchor="middle">ABSORBED</text>
  <g>
    <circle cx="626" cy="170" r="12" class="green"/><text class="ionlab" x="626" y="173" text-anchor="middle">Fe</text>
    <circle cx="656" cy="170" r="12" class="green"/><text class="ionlab" x="656" y="173" text-anchor="middle">Mg</text>
    <circle cx="686" cy="170" r="12" class="green"/><text class="ionlab" x="686" y="173" text-anchor="middle">Cu</text>
    <circle cx="716" cy="170" r="12" class="green"/><text class="ionlab" x="716" y="173" text-anchor="middle">Zn</text>
    <circle cx="746" cy="170" r="12" class="green"/><text class="ionlab" x="746" y="173" text-anchor="middle">Ca</text>
  </g>
  <path d="M626,214 V190 M656,214 V190 M686,214 V190 M716,214 V190 M746,214 V190" stroke="var(--green)" stroke-width="2" marker-end="url(#ahg)" fill="none"/>
  <line x1="596" y1="232" x2="776" y2="232" stroke="var(--green)" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="cap" x="686" y="252" text-anchor="middle" style="font-size:10px">gut lining &#8594; bloodstream</text>
  <text class="cap" x="686" y="300" text-anchor="middle">All five freed</text>
  <text class="cap" x="686" y="316" text-anchor="middle">and taken up</text>

  <circle cx="34" cy="374" r="7" class="amber"/><text class="leg" x="46" y="378">bound / locked</text>
  <circle cx="150" cy="374" r="7" class="green"/><text class="leg" x="162" y="378">freed / absorbed</text>
  <line x1="24" y1="404" x2="796" y2="404" stroke="var(--b)" stroke-width="1"/>
  <text class="foot" x="24" y="430">The minerals only count if you absorb them.</text>
  <text class="cap" x="796" y="430" text-anchor="end" style="font-weight:600">Sponsored by Goodphyte &#183; goodphyte.com</text>
</svg>
