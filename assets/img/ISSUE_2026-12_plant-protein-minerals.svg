<svg viewBox="0 0 820 440" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Plant-based: protein is solved, mineral absorption is the catch</title>
  <desc>Two panels. Left: protein and leucine are handled on a well-planned plant-based diet. Right: phytate in plant foods locks iron, zinc and magnesium, and phytase unlocks them for absorption.</desc>
  <style>
    text{font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;}
    .title{font-size:23px;font-weight:700;fill:#22565c;}
    .sub{font-size:13px;fill:#6f6a62;}
    .cap{font-size:12px;fill:#6f6a62;}
    .h{font-size:14px;font-weight:700;letter-spacing:.4px;}
    .body{font-size:12.5px;fill:#6f6a62;}
    .ion{font-size:12px;font-weight:700;fill:#fff;}
    .pill{font-size:12px;font-weight:700;fill:#fff;}
    .foot{font-size:12px;font-weight:600;fill:#22565c;}
  </style>
  <text class="title" x="410" y="34" text-anchor="middle">Going plant-based without starving your minerals</text>
  <text class="sub" x="410" y="56" text-anchor="middle">Protein is the easy part &#8212; mineral absorption is the catch</text>

  <defs>
    <marker id="ao2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f36f21"/></marker>
  </defs>

  <!-- LEFT: protein solved -->
  <rect x="24" y="88" width="370" height="236" rx="12" fill="#f7f5f3" stroke="#dadfd0" stroke-width="1.5"/>
  <text class="h" x="52" y="120" fill="#22565c">PROTEIN &amp; LEUCINE</text>
  <circle cx="96" cy="190" r="30" fill="#22565c"/>
  <path d="M82,190 l9,11 l19,-24" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="body" x="148" y="170">Largely solved. Well-planned</text>
  <text class="body" x="148" y="188">plant-based diets supply enough</text>
  <text class="body" x="148" y="206">protein and leucine to support</text>
  <text class="body" x="148" y="224">training adaptations.</text>
  <text class="cap" x="52" y="296" style="font-weight:700;fill:#22565c">&#10003; handled with planning</text>

  <!-- RIGHT: minerals are the catch -->
  <rect x="426" y="88" width="370" height="236" rx="12" fill="#f7f5f3" stroke="#dadfd0" stroke-width="1.5"/>
  <text class="h" x="454" y="120" fill="#c4571a">MINERALS &#8212; THE CATCH</text>
  <!-- phytate cage with sage ions -->
  <rect x="454" y="150" width="150" height="46" rx="8" fill="none" stroke="#6e807d" stroke-width="2.5" stroke-dasharray="3 5"/>
  <text class="cap" x="529" y="146" text-anchor="middle" style="fill:#6e807d;font-weight:700">phytate</text>
  <circle cx="486" cy="173" r="14" fill="#a5b4b1"/><text class="ion" x="486" y="177" text-anchor="middle">Fe</text>
  <circle cx="529" cy="173" r="14" fill="#a5b4b1"/><text class="ion" x="529" y="177" text-anchor="middle">Zn</text>
  <circle cx="572" cy="173" r="14" fill="#a5b4b1"/><text class="ion" x="572" y="177" text-anchor="middle">Mg</text>
  <!-- phytase frees -->
  <line x1="612" y1="173" x2="664" y2="173" stroke="#f36f21" stroke-width="3" marker-end="url(#ao2)"/>
  <rect x="668" y="156" width="76" height="34" rx="17" fill="#f36f21"/>
  <text class="pill" x="706" y="178" text-anchor="middle">phytase</text>
  <text class="body" x="454" y="240">Phytate locks iron, zinc and magnesium.</text>
  <text class="body" x="454" y="258">Phytase unlocks them for absorption.</text>
  <text class="cap" x="454" y="296" style="font-weight:700;fill:#c4571a">&#9888; absorb, don&#8217;t just eat</text>

  <line x1="24" y1="388" x2="796" y2="388" stroke="#dadfd0" stroke-width="1"/>
  <text class="foot" x="24" y="414">A plant-based plate delivers more of what it promises with phytase.</text>
  <text class="cap" x="796" y="414" text-anchor="end" style="font-weight:600;fill:#22565c">Sponsored by Goodphyte &#183; goodphyte.com</text>
</svg>
